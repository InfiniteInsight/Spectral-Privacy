I am exercising my privacy rights under CCPA/GDPR.

Request: Permanent deletion and opt-out from RocketReach database

Personal Information:
- Full Name: {full_name}
- Email addresses: {user_email}, [any work emails]
- Phone numbers: {phone_number}, [any work phones]
- Company: [Current and previous employers]
- LinkedIn profile: [LinkedIn URL if applicable]
- Job title: [Current title]

Please:
1. Permanently delete ALL my data from RocketReach's database
2. Add me to a permanent opt-out/suppression list
3. Stop scraping my data from LinkedIn and public sources
4. Confirm deletion and opt-out in writing
5. Explain your re-scraping prevention measures

I expect completion within 30 days as required by GDPR/CCPA.

Thank you.
"""
