# LinkedIn Ads - LinkedIn Advertising Platform
# Last verified: 2026-02-25

[broker]
id = "linkedin-ads"
name = "LinkedIn Ads"
url = "https://business.linkedin.com/marketing-solutions"
domain = "linkedin.com"
category = "marketing"
difficulty = "Easy"
typical_removal_days = 1
recheck_interval_days = 90
last_verified = "2026-02-25"
scan_priority = "AutoScanTier1"
region_relevance = ["Global"]

[search]
method = "account-required"
url = "https://www.linkedin.com/psettings/advertising"
instructions = "LinkedIn Ads uses professional profile data (job title, industry, skills, company) plus activity (articles read, posts engaged with, job searches) for B2B advertising targeting."

[removal]
method = "account-required"
url = "https://www.linkedin.com/psettings/advertising"
confirmation = "automatic"
notes = """
LinkedIn advertising opt-out:

1. AD PREFERENCES:
   - Visit https://www.linkedin.com/psettings/advertising
   - Turn OFF "Data for personalization of ads"
   - Turn OFF "Ads that include your social actions"
   - Turn OFF "Profile data for ad personalization to members off LinkedIn"

2. PARTNER DATA:
   - Settings > Data privacy > Manage
   - Turn OFF "Data shared with LinkedIn from other Microsoft services"
   - Stops Microsoft sharing Edge/Bing/Office data with LinkedIn

3. INSIGHT TAG OPT-OUT:
   - LinkedIn tracks activity on company websites via Insight Tag
   - No direct opt-out - use browser privacy settings or ad blockers
   - Or clear LinkedIn cookies regularly

4. CCPA/GDPR REQUESTS:
   - Email: privacy-policy@linkedin.com
   - Request: Data deletion or opt-out of sale
   - California/EU residents have additional rights

5. COOKIE REMOVAL:
   - Clear LinkedIn tracking cookies
   - Cookie names: lidc, bcookie, bscookie, UserMatchHistory
   - Use Spectral cookie scanner

NOTE: LinkedIn is owned by Microsoft - data may be shared across Microsoft properties (Bing, Edge, Office).
"""

[removal.cookies]
patterns = ["lidc", "bcookie", "bscookie", "UserMatchHistory", "li_*", "lang"]
domains = [".linkedin.com", ".licdn.com"]
