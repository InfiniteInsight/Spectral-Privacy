# Clearbit - B2B Data Enrichment Platform
# Last verified: 2026-02-25

[broker]
id = "clearbit"
name = "Clearbit"
url = "https://clearbit.com"
domain = "clearbit.com"
category = "marketing"
difficulty = "Hard"
typical_removal_days = 30
recheck_interval_days = 90
last_verified = "2026-02-25"
scan_priority = "OnRequest"
region_relevance = ["Global"]

[search]
method = "manual"
url = "https://clearbit.com"
instructions = "Clearbit is B2B data enrichment platform that provides company/person data to sales/marketing tools. Aggregates from public sources: LinkedIn, company websites, social profiles, public records."

[removal]
method = "email"
email = "privacy@clearbit.com"
subject = "CCPA/GDPR Data Deletion Request"
body = """
I am exercising my privacy rights under CCPA/GDPR.

Request: Deletion of all personal and professional data

Personal Information:
- Email: {user_email}
- Name: {full_name}
- Company: [If applicable]
- LinkedIn profile: [If applicable]

Please remove from:
- Clearbit Enrichment API
- Clearbit Prospector
- All data products

Confirm deletion within legally required timeframe.

Thank you.
"""
response_days = 30
notes = """
Clearbit privacy controls:

1. WHAT IS CLEARBIT:
   - B2B data enrichment platform (think "reverse phone lookup for email")
   - Used by sales/marketing teams via integrations:
     * Salesforce
     * HubSpot
     * Marketo
     * Segment
   - When you fill form with business email, Clearbit adds: title, company, location, social profiles
   - Aggregates from: LinkedIn, company websites, GitHub, Twitter/X, Crunchbase, public records

2. HOW CLEARBIT GETS YOUR DATA:
   - Scrapes LinkedIn profiles
   - Monitors company websites (About Us, Team pages)
   - Indexes social media profiles
   - Aggregates from public business records
   - You never interact with Clearbit directly

3. REQUEST DATA DELETION:
   - Email: privacy@clearbit.com
   - Subject: "CCPA/GDPR Data Deletion Request"
   - Include: Email, name, company, LinkedIn URL
   - Clearbit must comply within 30 days

4. OPT OUT OF CLEARBIT:
   - Visit: https://clearbit.com/privacy (check for opt-out form)
   - No centralized opt-out currently available
   - Must request via email

5. PREVENT DATA SCRAPING:
   - LinkedIn: Set profile to private (Connections only)
   - Company website: Remove yourself from Team/About pages
   - Social profiles: Use privacy settings to limit public visibility
   - GitHub: Use private repos, limit public profile info

6. REALITY CHECK:
   - Clearbit re-scrapes data periodically (30-90 days)
   - Even after deletion, may be re-added from public sources
   - Only way to stay removed: Remove data at source (LinkedIn, website, etc.)
   - Widely used in B2B sales (Clearbit or competitors like ZoomInfo, Apollo)

IMPACT ON B2B SALES:
- If you're in B2B sales/marketing, being in Clearbit may be beneficial
- Helps potential customers/partners find and contact you
- Consider: Do you want to be findable by recruiters/business contacts?

ALTERNATIVES:
- Instead of full removal, update Clearbit data to be accurate
- Email privacy@clearbit.com to correct inaccurate information
- This is often more practical than complete removal

TECHNICAL DETAILS:
- Clearbit Enrichment API: Enriches email addresses
- Clearbit Prospector: Finds emails at specific companies
- Clearbit Reveal: Identifies website visitors by IP
- All products pull from same underlying database
"""

[removal.cookies]
patterns = ["_clearbit_*", "_ga*", "_gid"]
domains = [".clearbit.com", ".reveal.clearbit.com"]
