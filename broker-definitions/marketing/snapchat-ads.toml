# Snapchat Ads - Social Media Advertising Platform
# Last verified: 2026-02-25

[broker]
id = "snapchat-ads"
name = "Snapchat Advertising"
url = "https://businesshelp.snapchat.com"
domain = "snapchat.com"
category = "marketing"
difficulty = "Medium"
typical_removal_days = 30
recheck_interval_days = 90
last_verified = "2026-02-25"
scan_priority = "OnRequest"
region_relevance = ["Global"]

[search]
method = "account-required"
url = "https://accounts.snapchat.com/accounts/privacy"
instructions = "Snapchat tracks in-app behavior, camera usage, location data, and website visits (via Snap Pixel) to personalize ads. Must have account to access privacy settings."

[removal]
method = "account-required"
url = "https://accounts.snapchat.com/accounts/privacy"
notes = """
Snapchat advertising privacy controls:

1. DISABLE AD PERSONALIZATION:
   - Open Snapchat app → Settings (gear icon)
   - Privacy Controls → Ads Preferences
   - Toggle OFF "Audience-Based Advertising"
   - Toggle OFF "Activity-Based Advertising"
   - This limits ad targeting but doesn't stop data collection

2. CLEAR AD PREFERENCES:
   - Ads Preferences → Lifestyle & Interests
   - Remove all categories Snapchat inferred about you
   - Ads Preferences → Advertisers
   - See which advertisers uploaded your info (email/phone match)

3. LIMIT SNAP PIXEL TRACKING:
   - Snapchat tracks you on external websites via Snap Pixel
   - No in-app opt-out for this
   - Use browser ad blockers (Privacy Badger, uBlock Origin)
   - Block domains: *.sc-static.net, *.snap-pixel.com

4. REQUEST DATA DELETION (GDPR/CCPA):
   - Visit https://support.snapchat.com/privacy
   - Submit "Delete My Data" request
   - Snapchat must respond within 30-45 days
   - Account deletion may be required for full data removal

5. ACCOUNT DELETION (FULL REMOVAL):
   - Settings → Account Actions → Delete Account
   - Account deactivated for 30 days, then deleted
   - All Snaps, Stories, Memories, and Chats deleted
   - Profile removed from search and friends lists

6. MOBILE ADVERTISING ID RESET:
   - iOS: Settings → Privacy → Apple Advertising → Reset Identifier
   - Android: Settings → Google → Ads → Reset advertising ID
   - Breaks Snapchat's cross-app tracking ability

REALITY:
- Snapchat is a mobile-first platform (less cookie-based tracking)
- Relies heavily on mobile advertising IDs (IDFA on iOS, AAID on Android)
- Snap Pixel tracks across web, similar to Facebook Pixel
- Opt-outs are in-app settings, easily reversible by Snapchat
- Account deletion is most effective privacy measure

TECHNICAL DETAILS:
- Snap Pixel domains: *.sc-static.net, *.snap-pixel.com
- Mobile ad tracking: Uses IDFA (iOS) and AAID (Android)
- Cookie usage: Limited (app-based platform, not web-based)
"""

[removal.cookies]
patterns = ["sc-cookies-*", "_scid", "_sctr", "_schn*"]
domains = [".snapchat.com", ".sc-static.net", ".snap-pixel.com"]
