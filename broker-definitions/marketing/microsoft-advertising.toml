# Microsoft Advertising - Bing Ads and Search Advertising
# Last verified: 2026-02-25

[broker]
id = "microsoft-advertising"
name = "Microsoft Advertising (Bing Ads)"
url = "https://about.ads.microsoft.com"
domain = "microsoft.com"
category = "marketing"
difficulty = "Easy"
typical_removal_days = 1
recheck_interval_days = 90
last_verified = "2026-02-25"
scan_priority = "AutoScanTier2"
region_relevance = ["Global"]

[search]
method = "account-required"
url = "https://account.microsoft.com/privacy/ad-settings"
instructions = "Microsoft tracks search queries (Bing), browsing (Edge), app usage (Windows), location, Cortana interactions, Office documents, Xbox activity. Data used for personalized ads across Microsoft properties and partner sites."

[removal]
method = "account-required"
url = "https://account.microsoft.com/privacy/ad-settings"
confirmation = "automatic"
notes = """
Microsoft advertising privacy controls:

1. AD PERSONALIZATION:
   - Visit https://account.microsoft.com/privacy/ad-settings
   - Turn OFF "See relevant ads based on your activity"
   - Disables personalized ads across Microsoft services

2. ACTIVITY HISTORY:
   - Visit https://account.microsoft.com/privacy/activity-history
   - Clear search history, browsing history, location activity
   - Turn OFF "Activity history"

3. CORTANA/VOICE DATA:
   - Visit https://account.microsoft.com/privacy/cortana
   - Turn OFF Cortana personalization
   - Delete voice recordings

4. LOCATION TRACKING:
   - Visit https://account.microsoft.com/privacy/location
   - Turn OFF location tracking
   - Clear location history

5. DOWNLOAD YOUR DATA:
   - Visit https://account.microsoft.com/privacy/download-data
   - Export: browsing, search, location, Cortana, Xbox data
   - Choose data categories and request export

6. DIAGNOSTIC DATA (Windows):
   - Settings > Privacy > Diagnostics & feedback
   - Set to "Required diagnostic data" (minimum)
   - Turn OFF "Optional diagnostic data"

7. MICROSOFT ACCOUNT PRIVACY:
   - Visit https://account.microsoft.com/privacy
   - Review all privacy settings
   - Manage app permissions

NOTE: Microsoft integrates deeply with Windows OS. Complete privacy requires disabling multiple features across Windows, Edge, Office, Xbox, and online services.
"""
