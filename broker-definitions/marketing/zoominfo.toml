# ZoomInfo - B2B Contact Database and Sales Intelligence
# Last verified: 2026-02-25

[broker]
id = "zoominfo"
name = "ZoomInfo"
url = "https://www.zoominfo.com"
domain = "zoominfo.com"
category = "marketing"
difficulty = "Hard"
typical_removal_days = 30
recheck_interval_days = 90
last_verified = "2026-02-25"
scan_priority = "OnRequest"
region_relevance = ["US", "Global"]

[search]
method = "manual"
url = "https://www.zoominfo.com"
instructions = "ZoomInfo aggregates professional data: work email, direct phone, job title, company, employment history. Used by sales/recruiting teams. Scrapes LinkedIn, company websites, SEC filings, social media."

[removal]
method = "web-form"
url = "https://www.zoominfo.com/about-zoominfo/privacy-center"
confirmation = "manual"
fields = { email = "{user_email}" }
notes = """
ZoomInfo opt-out (B2B professionals hate this one):

1. SEARCH FOR YOUR PROFILE:
   - Visit https://www.zoominfo.com/
   - Search your name + current company
   - Note the profile URL

2. OPT-OUT FORM:
   - Visit https://www.zoominfo.com/about-zoominfo/privacy-center
   - Click "Update/Remove Profile"
   - Enter work email address
   - Verify via email link
   - Processing: 24-48 hours for suppression

3. ALTERNATIVE - EMAIL:
   - Email: privacy@zoominfo.com
   - Include: Full name, company, job title, work email
   - Subject: "Profile Removal Request - CCPA/GDPR"

4. VERIFY REMOVAL:
   - Search again after 5-7 days
   - Profile should show "Contact information not available"
   - Or profile removed entirely

5. RECURRING PROBLEM:
   - ZoomInfo re-scrapes data regularly
   - May need to opt-out again if you change jobs
   - If you update LinkedIn, ZoomInfo may re-add you
   - Consider opting out every 6-12 months

CCPA/GDPR RIGHTS:
- California residents: Right to deletion under CCPA
- EU residents: Right to erasure under GDPR
- Email privacy@zoominfo.com invoking these rights

WHY THIS MATTERS:
- ZoomInfo sells access to your work contact info
- Sales teams use it to cold call/email you
- Recruiters use it to poach employees
- Competitors can see your job title and role

REALITY:
- ZoomInfo is one of many B2B databases (also: Clearbit, RocketReach, Apollo, Lusha)
- Removing from one doesn't remove from others
- Data comes from public sources (LinkedIn, company sites)
- Best protection: Minimize public professional profiles
"""

[removal.form_selectors]
email_input = "#email"
submit_button = "button[type='submit']"
success_indicator = ".confirmation"
