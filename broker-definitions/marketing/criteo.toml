# Criteo - Retargeting and Performance Marketing
# Last verified: 2026-02-25

[broker]
id = "criteo"
name = "Criteo"
url = "https://www.criteo.com"
domain = "criteo.com"
category = "marketing"
difficulty = "Easy"
typical_removal_days = 1
recheck_interval_days = 90
last_verified = "2026-02-25"
scan_priority = "AutoScanTier2"
region_relevance = ["Global"]

[search]
method = "manual"
url = "https://www.criteo.com"
instructions = "Criteo tracks browsing behavior to show retargeted ads (products you viewed following you across sites). Profile is cookie-based and anonymous. No way to view your profile directly."

[removal]
method = "web-form"
url = "https://www.criteo.com/privacy/"
confirmation = "automatic"
fields = { email = "{user_email}" }
notes = """
Opt-out from Criteo retargeting:

1. CRITEO DIRECT OPT-OUT:
   - Visit https://www.criteo.com/privacy/
   - Scroll to "Opt-Out" section
   - Click "Opt Out" button
   - Sets opt-out cookie in your browser

2. COOKIE-BASED LIMITATION:
   - Opt-out is per browser/device
   - Clearing cookies removes opt-out - must re-opt-out
   - Consider using browser extensions to maintain

3. BROWSER PRIVACY FEATURES:
   - Safari: Intelligent Tracking Prevention (auto-blocks)
   - Firefox: Enhanced Tracking Protection (blocks by default)
   - Chrome: Block third-party cookies in settings
   - Edge: Tracking Prevention

4. INDUSTRY OPT-OUTS:
   - NAI: https://optout.networkadvertising.org
   - DAA: https://optout.aboutads.info
   - EDAA (Europe): https://www.youronlinechoices.com
   - All cover Criteo and other ad networks

5. BROWSER EXTENSIONS:
   - Privacy Badger
   - uBlock Origin
   - Ghostery
   - Block retargeting pixels automatically

Note: Opt-out stops retargeting ads but doesn't delete browsing history already collected. Must repeat per browser/device. Clearing cookies removes opt-out.
"""

[removal.form_selectors]
optout_button = "button.optout, a[href*='optout']"
success_indicator = ".optout-success"
