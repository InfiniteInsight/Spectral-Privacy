# Experian - Consumer Credit Bureau
# Last verified: 2026-02-25
# NOTE: This is a CREDIT BUREAU - you cannot and should not remove legitimate credit data.
# This definition focuses on privacy controls: freezes, opt-outs, and accuracy.

[broker]
id = "experian"
name = "Experian"
url = "https://www.experian.com"
domain = "experian.com"
category = "data-aggregator"
difficulty = "Medium"
typical_removal_days = 30
recheck_interval_days = 180
last_verified = "2026-02-25"
scan_priority = "OnRequest"
region_relevance = ["US", "Global"]

[search]
method = "manual"
url = "https://www.experian.com/consumer-products/free-credit-report.html"
instructions = """
⚠️ IMPORTANT: Experian is a credit bureau regulated by the Fair Credit Reporting Act (FCRA).

You CANNOT remove legitimate credit history - and shouldn't want to. Credit history is essential for:
- Getting loans, mortgages, credit cards at reasonable rates
- Renting apartments (landlords check credit)
- Some employment opportunities
- Opening utilities/phone plans

To view your credit report:
1. Visit AnnualCreditReport.com (federally mandated free report)
2. Or create Experian account for ongoing monitoring
3. Verify identity with SSN, DOB, address history

Your credit report shows: accounts, payment history, inquiries, public records.
"""

[removal]
method = "account-required"
url = "https://www.experian.com/freeze/center.html"
notes = """
CREDIT PRIVACY BEST PRACTICES (not data removal):

✅ WHAT YOU CAN AND SHOULD DO:

1. SECURITY FREEZE (Highly Recommended):
   - FREE and prevents unauthorized access to credit report
   - Blocks identity thieves from opening accounts in your name
   - Does NOT affect credit score or existing accounts
   - Online: https://www.experian.com/freeze/center.html
   - Phone: 1-888-397-3742
   - Lift temporarily when applying for credit

2. OPT-OUT OF PRE-SCREENED CREDIT OFFERS:
   - Reduces junk mail for credit cards/insurance
   - Visit OptOutPrescreen.com or call 1-888-567-8688
   - 5-year opt-out (online) or permanent (mail form)
   - Affects Experian, Equifax, TransUnion, Innovis

3. OPT-OUT OF EXPERIAN MARKETING:
   - Prevents Experian from selling your name for marketing
   - Visit: https://www.experian.com/privacy/opting_out.html
   - Or call: 1-888-567-8688
   - Takes 30 days to process

4. DISPUTE INACCURATE INFORMATION:
   - You have FCRA right to dispute errors
   - Online: https://www.experian.com/disputes/main.html
   - Must be investigated within 30 days by law
   - Removes/corrects unverifiable or incorrect data
   - Does NOT remove accurate negative information

5. FRAUD ALERTS:
   - If identity theft victim, place fraud alert
   - Lenders must verify identity before extending credit
   - Free, lasts 1 year (renewable)
   - Call: 1-888-397-3742

❌ WHAT YOU CANNOT/SHOULD NOT DO:

- Remove legitimate credit accounts (impossible and harmful)
- Delete accurate payment history
- Erase valid public records (bankruptcies, liens)
- Close your credit file entirely

⚖️ CALIFORNIA RESIDENTS (CCPA):
- Right to know what data Experian has
- Right to opt-out of data sales to third parties
- Cannot delete credit reporting data (FCRA exemption)
- Submit requests: https://www.experian.com/privacy/ccpa

📋 UNDERSTANDING CREDIT DATA:
- Positive history: Kept indefinitely (helps your score)
- Negative items: Automatically removed after 7-10 years
- Inquiries: Removed after 2 years
- Bankruptcies: Chapter 7 (10 years), Chapter 13 (7 years)

🎯 RECOMMENDED ACTIONS:
1. Place security freeze (free, effective protection)
2. Opt-out of pre-screened offers (reduce junk mail)
3. Monitor credit report annually (free at AnnualCreditReport.com)
4. Dispute any inaccuracies found
5. Keep legitimate accounts open and in good standing

For questions: 1-888-397-3742 or visit https://www.experian.com/help/
"""
