# LexisNexis - Legal and Public Records Database
# Last verified: 2026-02-25

[broker]
id = "lexisnexis"
name = "LexisNexis"
url = "https://www.lexisnexis.com"
domain = "lexisnexis.com"
category = "data-aggregator"
difficulty = "Hard"
typical_removal_days = 14
recheck_interval_days = 60
last_verified = "2026-02-25"
scan_priority = "AutoScanTier1"
region_relevance = ["US", "Global"]

[search]
method = "manual"
url = "https://www.lexisnexis.com"
instructions = "LexisNexis databases are subscription-based for legal, corporate, and government use. Personal searches not publicly available. Data comes from public records, court filings, property records, and other sources."

[removal]
method = "web-form"
url = "https://risk.lexisnexis.com/opt-out"
confirmation = "manual"
notes = """
LexisNexis opt-out process:

1. CONSUMER DISCLOSURE:
   - Request free consumer disclosure to see what data they have
   - Visit https://consumer.risk.lexisnexis.com/request
   - Must provide: Name, address, SSN, DOB
   - Receive report within 7-10 business days

2. OPT-OUT REQUEST:
   - Submit form at https://risk.lexisnexis.com/opt-out
   - Provide: Full name, current address, previous addresses, DOB
   - May require ID verification (driver's license copy)
   - Processing takes 7-14 business days

3. TARGETED PRODUCTS:
   - LexisNexis Accurint: law enforcement/skip tracing
   - ThreatMetrix: fraud prevention
   - Each product has separate opt-out process

Note: Opt-out removes data from marketing/people search products but NOT from legal research databases used by attorneys, courts, and government. Public record data may remain accessible through legal channels.
"""

[removal.fields]
first_name = "{first_name}"
last_name = "{last_name}"
address = "{address}"
city = "{city}"
state = "{state}"
zip_code = "{zip_code}"
date_of_birth = "{date_of_birth}"

[removal.form_selectors]
first_name_input = "#firstName"
last_name_input = "#lastName"
address_input = "#address"
city_input = "#city"
state_input = "#state"
zip_input = "#zipCode"
submit_button = "button[type='submit']"
success_indicator = ".confirmation"
