[search]
method = "manual"
url = "https://www.snapchat.com"
instructions = "Snapchat profiles require friendship to view. Data collected: snaps, chats, stories, location (Snap Map), face data (lenses), interests, friends, device info, advertising ID."

[removal]
method = "manual"
url = "https://accounts.snapchat.com/accounts/settings"
confirmation = "automatic"
notes = """
Snapchat privacy controls:

1. LOCATION PRIVACY (CRITICAL):
   - Settings > See My Location
   - Select "Ghost Mode" (hides you from Snap Map)
   - Or select specific friends who can see location
   - By default, location is shared with ALL friends

2. WHO CAN...
   - Settings > Privacy Control > Contact Me: Friends only
   - Settings > Privacy Control > View My Story: Friends only
   - Settings > Privacy Control > See Me in Quick Add: Turn OFF

3. AD PREFERENCES:
   - Settings > Ad Preferences
   - Turn OFF "Audience-Based" ads
   - Turn OFF "Activity-Based" ads
   - Limits targeting but doesn't stop all ads

4. DATA COLLECTION:
   - Settings > Privacy Control > Manage Preferences
   - Turn OFF "Personalized Advertising"
   - Turn OFF all data sharing options

5. DOWNLOAD YOUR DATA:
   - Visit https://accounts.snapchat.com/accounts/downloadmydata
   - Request "My Data" archive
   - Includes: account info, snap history, friends, location history
   - Processing takes 24-72 hours

6. DELETE ACCOUNT:
   - Visit https://accounts.snapchat.com/accounts/delete_account
   - Account deactivated for 30 days
   - Permanently deleted after 30 days

WARNING: Snapchat collects precise location data, face biometrics (for lenses), and advertising ID. Ghost Mode is essential for location privacy.
"""
