scan_priority = "OnRequest"
region_relevance = ["US", "Global"]

[search]
method = "manual"
url = "https://www.verifiedcredentials.com"
instructions = "Verified Credentials performs background checks and credential verification for employers. Verifies: Education, employment, licenses, certifications. Data collected per employer request with your consent."

[removal]
method = "email"
email = "privacy@verifiedcredentials.com"
subject = "FCRA Privacy Rights Request - Background Check Data"
body = """
I am exercising my rights under the Fair Credit Reporting Act (FCRA).

Request Type: [Choose one]
- Access my background check report
- Dispute inaccurate information in my report
- Request disclosure of report provided to employer

Personal Information:
- Name: {full_name}
- Email: {user_email}
- Date of Birth: [MM/DD/YYYY]
- SSN (last 4 digits): [For verification]
- Employer/Company that requested check: [If known]

Please respond within legally required timeframe.

Thank you.
"""
response_days = 30
notes = """
Verified Credentials background check privacy:

1. WHAT IS VERIFIED CREDENTIALS:
   - Background screening company
   - Performs checks for employers (pre-employment, ongoing)
   - Verifies:
     * Education (degrees, transcripts)
     * Employment history
     * Professional licenses
     * Certifications
     * Criminal records
     * Credit reports (if authorized)
     * Drug testing results

2. HOW VERIFIED CREDENTIALS WORKS:
   - Employer orders background check (with your consent)
   - You authorize via signed release form (FCRA requirement)
   - Verified Credentials contacts:
     * Universities (degree verification)
     * Previous employers
     * Licensing boards
     * Courts (criminal records)
   - Compiles report for employer

3. YOUR RIGHTS (FCRA - FAIR CREDIT REPORTING ACT):
   - Disclosure: Employer must tell you if they use background check
   - Authorization: Must sign consent before check
   - Pre-Adverse Action: If employer considers denying job, must:
     * Give you copy of report
     * Provide "Summary of Rights Under FCRA"
     * Allow time to dispute errors
   - Adverse Action: If denied due to report, must:
     * Notify you in writing
     * Provide contact info for Verified Credentials
     * Explain your right to dispute

4. REQUEST YOUR REPORT:
   - Email: privacy@verifiedcredentials.com
   - Phone: Check website for consumer relations number
   - Include: Name, DOB, SSN (last 4), employer name
   - Free copy if:
     * Adverse action taken within 60 days
     * Once per 12 months (annual disclosure)

5. DISPUTE INACCURATE INFORMATION:
   - If report shows errors:
     * Wrong degree, incorrect employment dates, inaccurate license status
   - Email: privacy@verifiedcredentials.com
   - Include:
     * Specific error
     * Correct information
     * Supporting docs (transcript, offer letter, license copy)
   - Verified Credentials must investigate within 30 days (FCRA)
   - Must correct or delete unverified information

6. CCPA/GDPR RIGHTS:
   - Email: privacy@verifiedcredentials.com
   - California residents: Right to know, delete, opt-out
   - But: FCRA may supersede CCPA for employment screening
   - Deletion of accurate background check data may not be required

7. WHAT YOU CANNOT DO:
   - Cannot "opt out" of background checks for employment
   - Refusing consent = employer likely won't hire you
   - Cannot remove accurate information
   - Cannot prevent employer from ordering check (but they need consent)

8. IF YOUR REPORT HAS ERRORS:
   - Dispute immediately (especially if adverse action)
   - Provide documentation to Verified Credentials
   - Also correct at source:
     * University: Update registrar records
     * Licensing board: Ensure license info current
     * Previous employer: Correct HR records

9. DATA RETENTION:
   - FCRA: Most info kept 7 years
   - Criminal convictions: May be permanent
   - Employer-specific reports: Retained per contract
   - Request deletion after 7 years (for older data)

REALITY:
- Background checks are standard for employment
- Verified Credentials is one of many screening companies
- Cannot avoid checks if employer requires
- Focus: Ensure accuracy before job search
- Errors can cost you job opportunities

SIMILAR COMPANIES:
- HireRight (covered separately in Spectral)
- Checkr
- Sterling
- First Advantage
- All operate under FCRA

PROACTIVE STEPS:
1. Request your own background check before job search
2. Verify education records with university
3. Ensure professional licenses are current
4. Check criminal record accuracy (state court)
5. Review credit report (if applicable for position)

TIMELINE FOR DISPUTES:
- Verified Credentials: 30 days to investigate (FCRA)
- If unverified: Must delete within 5 business days
- Pre-adverse action: Employer must give "reasonable time" to respond
- Act quickly when you receive pre-adverse action notice

CONTACT INFO:
- Privacy email: privacy@verifiedcredentials.com
- Consumer relations: Check verifiedcredentials.com/consumers
- Dispute line: Separate from sales/employer line
"""
