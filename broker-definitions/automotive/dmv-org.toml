# DMV.org - Vehicle Records and Driver Information
# Last verified: 2026-02-25

[broker]
id = "dmv-org"
name = "DMV.org"
url = "https://www.dmv.org"
domain = "dmv.org"
category = "automotive"
difficulty = "Hard"
typical_removal_days = 90
