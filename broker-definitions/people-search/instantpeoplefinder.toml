# Instant People Finder - People Search and Public Records
# Last verified: 2026-02-25

[broker]
id = "instantpeoplefinder"
name = "Instant People Finder"
url = "https://www.instantpeoplefinder.com"
domain = "instantpeoplefinder.com"
category = "people-search"
difficulty = "Medium"
typical_removal_days = 7
recheck_interval_days = 30
last_verified = "2026-02-25"
scan_priority = "OnRequest"
region_relevance = ["US"]

[search]
method = "url-template"
template = "https://www.instantpeoplefinder.com/people/{first_name}-{last_name}/{state}"
requires_fields = ["first_name", "last_name", "state"]

[search.result_selectors]
results_container = ".search-results"
result_item = ".person-result"
no_results_indicator = ".no-results"

[removal]
method = "web-form"
url = "https://www.instantpeoplefinder.com/opt-out"
notes = """
Instant People Finder opt-out process:

1. SEARCH FOR YOUR LISTING:
   - Visit https://www.instantpeoplefinder.com
   - Search: First name, last name, state
   - Find your specific listing

2. OPT-OUT FORM:
   - Visit https://www.instantpeoplefinder.com/opt-out
   - Enter the URL of your listing
   - Provide email for confirmation
   - May require reCAPTCHA verification

3. EMAIL VERIFICATION:
   - Check email for verification link
   - Click link to confirm opt-out
   - Processing: 24-48 hours

4. REMOVAL TIMELINE:
   - Initial removal: 24-48 hours
   - Full removal from cache/search engines: 5-7 days
   - Check back to verify removal

5. RE-SCRAPING RISK:
   - Instant People Finder may re-add data from public sources
   - Check every 30 days
   - Re-submit opt-out if re-listed

6. CCPA/GDPR RIGHTS:
   - California/EU residents have enhanced rights
   - Email: support@instantpeoplefinder.com or privacy contact
   - Request: Data access, deletion, opt-out of sale
   - Response within 30-45 days

REALITY:
- Aggregates from public records (DMV, voter registration, court records)
- Opt-out removes from Instant People Finder display only
- Data remains in original public sources
- May reappear if they re-scrape public databases

DATA DISPLAYED:
- Name, age, addresses (current and historical)
- Phone numbers
- Possible relatives
- Property ownership
- Court records, liens, judgments

TIP: If opt-out form doesn't work:
- Email: support@instantpeoplefinder.com
- Include: Your name, listing URL, request for removal
- Reference CCPA (if California resident)
"""
