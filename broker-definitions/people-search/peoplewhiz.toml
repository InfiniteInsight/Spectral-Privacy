# PeopleWhiz - People Search and Public Records
# Last verified: 2026-02-25

[broker]
id = "peoplewhiz"
name = "PeopleWhiz"
url = "https://www.peoplewhiz.com"
domain = "peoplewhiz.com"
category = "people-search"
difficulty = "Medium"
typical_removal_days = 7
recheck_interval_days = 30
last_verified = "2026-02-25"
scan_priority = "AutoScanTier2"
region_relevance = ["US"]

[search]
method = "url-template"
template = "https://www.peoplewhiz.com/search?name={first}+{last}&state={state}"
requires_fields = ["first_name", "last_name", "state"]

[search.result_selectors]
results_container = ".results-container"
result_item = ".person-result"
listing_url = "a.profile-url"
name = ".result-name"
age = ".result-age"
location = ".result-location"
no_results_indicator = ".no-results"

[removal]
method = "web-form"
url = "https://www.peoplewhiz.com/opt-out"
confirmation = "email-verification"
notes = """
PeopleWhiz opt-out:

1. FIND YOUR LISTING:
   - Search at https://www.peoplewhiz.com
   - Copy exact URL of your profile

2. OPT-OUT FORM:
   - Visit https://www.peoplewhiz.com/opt-out
   - Paste profile URL
   - Enter email address
   - Complete CAPTCHA

3. EMAIL VERIFICATION:
   - Check email for verification link
   - Click to confirm removal
   - Processing: 5-7 business days

4. VERIFY REMOVAL:
   - Search again after 7-10 days
   - If still listed, submit another request

NOTE: PeopleWhiz may re-add data from public sources. Monitor and re-submit removal requests periodically.
"""

[removal.form_selectors]
listing_url_input = "#profile-url"
email_input = "#email-address"
submit_button = "button.submit-optout"
captcha_frame = "iframe[src*='recaptcha']"
success_indicator = ".confirmation-message"
