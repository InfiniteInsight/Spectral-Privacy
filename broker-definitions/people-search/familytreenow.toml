# FamilyTreeNow - Free Genealogy and People Search
# Last verified: 2026-02-25

[broker]
id = "familytreenow"
name = "FamilyTreeNow"
url = "https://www.familytreenow.com"
domain = "familytreenow.com"
category = "people-search"
difficulty = "Easy"
typical_removal_days = 3
recheck_interval_days = 30
last_verified = "2026-02-25"
scan_priority = "AutoScanTier1"
region_relevance = ["US"]

[search]
method = "url-template"
template = "https://www.familytreenow.com/search/genealogy/results?first={first}&last={last}&citystatezip={state}"
requires_fields = ["first_name", "last_name", "state"]

[search.result_selectors]
results_container = ".search-results"
result_item = ".result-row"
listing_url = "a.result-link"
name = ".name-field"
age = ".age-range"
location = ".location-info"
relatives = ".relatives-list .relative"
phones = ".phone-numbers .phone"
no_results_indicator = ".no-results-found"
captcha_required = "iframe[title*='recaptcha' i]"

[removal]
method = "browser-form"
url = "https://www.familytreenow.com/optout"
confirmation = "email-verification"
notes = "Requires email verification. Must provide exact listing URL. Processing takes 2-4 business days. May need to submit multiple times for different variations of name."

[removal.fields]
listing_url = "{found_listing_url}"
email = "{user_email}"

[removal.form_selectors]
listing_url_input = "#url"
email_input = "#email"
submit_button = "button[type='submit'], input[type='submit']"
captcha_frame = "iframe[title*='recaptcha' i]"
success_indicator = ".confirmation-message, .alert-success"
error_indicator = ".error-message, .alert-danger"
