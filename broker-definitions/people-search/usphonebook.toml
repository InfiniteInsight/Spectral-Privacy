# USPhonebook - Phone Number and Address Directory
# Last verified: 2026-02-25

[broker]
id = "usphonebook"
name = "USPhonebook"
url = "https://www.usphonebook.com"
domain = "usphonebook.com"
category = "people-search"
difficulty = "Easy"
typical_removal_days = 3
recheck_interval_days = 30
last_verified = "2026-02-25"
scan_priority = "AutoScanTier1"
region_relevance = ["US"]

[search]
method = "url-template"
template = "https://www.usphonebook.com/{first}-{last}/{state}"
requires_fields = ["first_name", "last_name", "state"]

[search.result_selectors]
results_container = "#search-results"
result_item = ".result"
listing_url = "a.details-link"
name = ".result-name"
age = ".age-info"
location = ".location-text"
phones = ".phone-numbers .phone"
no_results_indicator = ".no-results-message"
captcha_required = "iframe[src*='recaptcha']"

[removal]
method = "browser-form"
url = "https://www.usphonebook.com/opt-out"
confirmation = "email-verification"
notes = "Requires email verification. Must copy exact listing URL from search results. Processing time is 2-4 business days."

[removal.fields]
listing_url = "{found_listing_url}"
email = "{user_email}"

[removal.form_selectors]
listing_url_input = "#recordUrl"
email_input = "#emailAddress"
submit_button = "button.submit-removal"
captcha_frame = "iframe[title*='recaptcha' i]"
success_indicator = ".opt-out-success"
error_indicator = ".opt-out-error"
