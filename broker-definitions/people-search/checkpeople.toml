# CheckPeople - People Search and Background Checks
# Last verified: 2026-02-25

[broker]
id = "checkpeople"
name = "CheckPeople"
url = "https://www.checkpeople.com"
domain = "checkpeople.com"
category = "people-search"
difficulty = "Medium"
typical_removal_days = 7
recheck_interval_days = 30
last_verified = "2026-02-25"
scan_priority = "AutoScanTier2"
region_relevance = ["US"]

[search]
method = "url-template"
template = "https://www.checkpeople.com/people/{first}-{last}/{state}"
requires_fields = ["first_name", "last_name", "state"]

[search.result_selectors]
results_container = ".search-results"
result_item = ".person-result"
listing_url = "a.profile-link"
name = ".person-name"
age = ".age"
location = ".location"
no_results_indicator = ".no-results"

[removal]
method = "web-form"
url = "https://www.checkpeople.com/optout"
confirmation = "email-verification"
notes = """
CheckPeople opt-out process:

1. FIND YOUR LISTING:
   - Search for yourself at https://www.checkpeople.com
   - Copy the exact URL of your profile

2. OPT-OUT FORM:
   - Visit https://www.checkpeople.com/optout
   - Paste your profile URL
   - Enter email address
   - Complete CAPTCHA

3. EMAIL VERIFICATION:
   - Check email for verification link
   - Click link to confirm removal
   - Processing: 3-7 business days

4. VERIFY REMOVAL:
   - Search again after 7 days
   - If still listed, repeat opt-out process

NOTE: CheckPeople shares data with related sites in the InfoPay/PeopleFinders network. May need to opt-out from multiple properties separately.
"""

[removal.form_selectors]
listing_url_input = "#profile-url"
email_input = "#email"
submit_button = "button.opt-out-submit"
captcha_frame = "iframe[src*='recaptcha']"
success_indicator = ".opt-out-confirmation"
