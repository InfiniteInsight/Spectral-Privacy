# Whitepages - Phone Number & Address Lookup
# Last verified: 2026-05-07
#
# Bot protection: Cloudflare Managed Challenge + DataDome
# - Cloudflare: JS fingerprint gate on first request. Bypassed by the headless
#   Chrome stealth patches (navigator.webdriver, plugins, etc.) + real GPU on
#   Windows. Residential IP greatly helps.
# - DataDome: Ongoing behavioral tracking (ddjskey injected on page load).
#   Typically does not challenge on a simple name search with a clean session.
#
# The scan engine's Chrome path (not reqwest) is required for this site.
# The SERP is SSR-rendered (Nuxt.js), so HTML content is present in page source
# once the bot gate is cleared.
#
# Person listing URL format: /name/{First}-{Last}/{City}-{State}/{wpId}
# Example confirmed: /name/Samuel-Joseph/Reisterstown-MD/P53kXOGEX8p

[broker]
id = "whitepages"
name = "Whitepages"
url = "https://www.whitepages.com"
domain = "whitepages.com"
category = "people-search"
difficulty = "Hard"
typical_removal_days = 5
recheck_interval_days = 30
last_verified = "2026-05-07"
scan_priority = "AutoScanTier1"
region_relevance = ["US", "Global"]

[search]
method = "url-template"
template = "https://www.whitepages.com/name/{first}-{last}/{city}-{state}"
requires_fields = ["first_name", "last_name", "city", "state"]

[search.result_selectors]
# Selectors verified 2026-05-07 against live SSR HTML from board's Chrome session.
#
# Whitepages redirects all name searches directly to a checkout/summary page
# that shows a "BEST MATCH" card. This IS the result page — there is no
# separate SERP list. The card is a clickable div (not an <a>), so listing_url
# targets the unlock button's href as a proxy for the page identity.
#
# Confirmed structure:
#   <div class="flat-top ... summary-card ... card">   ← result_item
#     <div class="display-2 fw-b">Samuel Joseph</div>  ← name
#     <div class="d-flex graphite--text my-1 ...">
#       <div><span>Age</span> 65+</div>                ← age (text node)
#       <span class="mx-1">|</span>
#       <div>Reisterstown, MD</div>                    ← location (last div)
#     </div>
#   </div>
results_container = ".flat-top.summary-card"
result_item = ".flat-top.summary-card"
listing_url = ".flat-top.summary-card a.wp-button, .unlock-report-button a"
name = ".display-2.fw-b"
age = ".d-flex.graphite--text.my-1 div:first-child"
location = ".d-flex.graphite--text.my-1 div:last-child"
no_results_indicator = "[class*='no-results'], [class*='zero-results'], [class*='no-match']"
captcha_required = "iframe[title*='recaptcha' i], [id*='datadome'], #ddCaptcha"

[removal]
method = "web-form"
url = "https://www.whitepages.com/suppression-requests"
confirmation = "email-verification"
notes = "Must verify phone number via SMS or email. Takes 24-72 hours to process."

[removal.fields]
listing_url = "{found_listing_url}"
email = "privacyrequest@whitepages.com"
phone = "{user_phone}"

[removal.form_selectors]
listing_url_input = "#url"
email_input = "#email"
first_name_input = "#firstName"
last_name_input = "#lastName"
submit_button = "button.submit-btn"
captcha_frame = "iframe[src*='recaptcha']"
success_indicator = ".success-message"

[removal.email_fallback]
enabled = true
email = "ccparequest@whitepages.com"
subject = "Privacy Request - Data Removal"
required_fields = ["full_name", "listing_url", "address", "phone"]
processing_days = 30
notes = "Email removal requests accepted. California residents use ccparequest@whitepages.com. General support: support@whitepages.com. May take up to 30 days for mail requests, faster for online."
ccpa_compliant = true
