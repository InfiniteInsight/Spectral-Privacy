# AnyWho - White Pages Directory
# Last verified: 2026-02-25

[broker]
id = "anywho"
name = "AnyWho"
url = "https://www.anywho.com"
domain = "anywho.com"
category = "people-search"
difficulty = "Medium"
typical_removal_days = 7
recheck_interval_days = 30
last_verified = "2026-02-25"
scan_priority = "AutoScanTier2"
region_relevance = ["US"]

[search]
method = "url-template"
template = "https://www.anywho.com/people/{first}+{last}/{state}/{city}"
requires_fields = ["first_name", "last_name", "state", "city"]

[search.result_selectors]
results_container = ".search-results"
result_item = ".person-result"
listing_url = "a.profile-link"
name = ".person-name"
age = ".age-range"
location = ".address"
phones = ".phone-number"
no_results_indicator = ".no-results"
captcha_required = ".recaptcha-container"

[removal]
method = "phone"
phone = "1-800-555-8355"
instructions = "Call customer service during business hours (Mon-Fri 9AM-6PM EST). Ask for the Privacy/Opt-Out department. Provide your name, address, and phone number to verify identity. Request removal from white pages directory. Reference listing URL if possible. May require callback for verification."
notes = "Phone-based removal only. No online opt-out form available. Customer service representatives will assist with removal. Processing takes 5-7 business days after verification."
