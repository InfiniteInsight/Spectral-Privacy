[package]
name = "spectral-selector-discovery"
description = "Automated CSS selector discovery and scoring for data broker site scanning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Internal dependencies
spectral-broker = { path = "../spectral-broker" }
spectral-browser = { path = "../spectral-browser" }
spectral-core = { path = "../spectral-core" }
spectral-vault = { path = "../spectral-vault" }

# Workspace dependencies
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
url = "2.5"
futures = { workspace = true }
once_cell = { workspace = true }
anyhow = { workspace = true }

# CLI (optional)
clap = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "spectral-discover"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
cli = ["clap", "tracing-subscriber"]
